# docker-compose to deploy multiple crawlers

services:

  crawler:
    # Match the host account that owns the bind-mounted data directory.
    user: "${CRAWLER_UID:-1000}:${CRAWLER_GID:-1000}"
    network_mode: host
    volumes:
      - ./../../data:/app/data
      - .env:/app/.env
    build:
      context: ./../../
      dockerfile: ./docker/crawler/Dockerfile
    restart: on-failure
    deploy:
      mode: replicated
      replicas: ${CRAWLER_REPLICAS}
