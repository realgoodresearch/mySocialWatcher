map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

upstream flask-app {
    server datahub_api:8000;
}

server {
    listen 80 default_server;
    server_name _;

    return 444;
}

server {
   listen                80;
   server_name           api.realgoodresearch.com serenity serenity.lan 192.168.50.5 127.0.0.1;

   location / {
       return 404;
   }

   location ~ ^/socialwatcher/v1(?:/|$) {
       # Flask serves the documentation root without a trailing slash.
       rewrite ^/socialwatcher/v1/$ /socialwatcher/v1 break;

       # Preserve the complete path expected by Flask.
       proxy_pass          http://flask-app;

       proxy_redirect    off;
       proxy_set_header  Host              $http_host;
       proxy_set_header  X-Real-IP         $remote_addr;
       proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
       proxy_set_header  X-Forwarded-Proto $scheme;

       client_body_buffer_size 16M;
       client_max_body_size 50M;
       proxy_connect_timeout 300s;
       proxy_send_timeout 300s;
       proxy_read_timeout 300s;
       send_timeout 300s;
   }
}
