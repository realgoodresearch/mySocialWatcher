services:

  datahub_web:
    container_name: datahub_web
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx_server.conf:/etc/nginx/conf.d/nginx_server.conf
    ports:
      - "80:80"
      - "443:443"
    networks:
      - net
    depends_on:
      - datahub_api
    restart: unless-stopped

  datahub_api:
    container_name: datahub_api
    env_file: .env
    build:
      dockerfile: ./docker/datahub/Dockerfile
      context: ./../../
    volumes:
      - type: bind
        source: ./../../mysocialwatcher/api/static
        target: /app/mysocialwatcher/api/static
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - datahub_db
    networks:
      - net
    ports:
      - "5000:5000"
      - "8000:8000"
    restart: unless-stopped

  datahub_limiter:
    container_name: datahub_limiter
    image: memcached:latest
    networks:
      - net
    ports:
      - "11211:11211"
    restart: unless-stopped

  datahub_db:
    container_name: datahub_db
    image: postgis/postgis:18-3.6
    env_file: .env
    shm_size: '1gb'
    command: ['postgres', '-c', 'config_file=/datahub/postgresql.conf']
    volumes:
      - type: bind
        source: /data/datahub/postgres18
        target: /datahub/data
        bind:
          create_host_path: false
      - type: bind
        source: ./initdb.sh
        target: /docker-entrypoint-initdb.d/initdb.sh
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./postgresql.conf
        target: /datahub/postgresql.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - net
    ports:
      - "5432:5432"
    restart: unless-stopped

networks:
  net:
