</html>
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Watcher DataHub</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #0b1220;
      --surface: rgba(20, 34, 56, 0.9);
      --text: #eef5ff;
      --muted: #a9bad1;
      --accent: #62d4ff;
      --success: #48d597;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, #16436a 0, transparent 38%),
        linear-gradient(145deg, var(--background), #111d31);
      font: 16px/1.6 system-ui, sans-serif;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(2rem, 6vw, 4rem);
      background: var(--surface);
      border: 1px solid #3b5a78;
      border-radius: 24px;
      box-shadow: 0 24px 70px #0008;
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
    }

    .intro {
      margin: 1rem 0 2rem;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .status {
      margin-bottom: 1.5rem;
      color: #c9f7dc;
      font-weight: 600;
    }

    .status::before {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      margin-right: 0.65rem;
      content: "";
      background: var(--success);
      border-radius: 50%;
    }

    .endpoint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.15rem;
      background: #050d1970;
      border: 1px solid #3b5a78;
      border-radius: 14px;
    }

    code {
      color: #d8efff;
      word-break: break-word;
    }

    a {
      padding: 0.65rem 1rem;
      color: #03111d;
      background: var(--accent);
      border-radius: 9px;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      background: #a4eaff;
    }

    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 520px) {
      .endpoint {
        align-items: stretch;
        flex-direction: column;
      }

      a {
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">Real Good Research</p>

    <h1>Social Watcher DataHub</h1>

    <p class="intro">
      A private data service for social media audience research.
    </p>

    <div class="status">Service is running</div>

    <div class="endpoint">
      <code>/socialwatcher/api/v1/</code>
      <a href="/socialwatcher/api/v1/">Open API</a>
    </div>

    <footer>
      Available on the trusted LAN and VPN networks.
    </footer>
  </main>
</body>

</html>
